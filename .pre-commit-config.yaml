# Aegis.js Pre-Commit Configuration
repos:
  - repo: local
    hooks:
      - id: build-check
        name: TypeScript Build Verification
        entry: npm run build
        language: system
        pass_filenames: false
      - id: test-check
        name: Zero-GC Test Verification
        entry: npm test
        language: system
        pass_filenames: false
